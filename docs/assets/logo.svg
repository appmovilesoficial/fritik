<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fritik — churros">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#fff0c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a751"/>
      <stop offset=".5" stop-color="#cf8a32"/>
      <stop offset="1" stop-color="#b06d1f"/>
    </linearGradient>
    <g id="stick">
      <rect x="-138" y="-25" width="276" height="50" rx="25" fill="url(#gold)" stroke="#8f5417" stroke-width="6"/>
      <g stroke="#9c5f1d" stroke-width="6" stroke-linecap="round" opacity=".8">
        <line x1="-108" y1="-14" x2="-108" y2="14"/>
        <line x1="-78" y1="-16" x2="-78" y2="16"/>
        <line x1="-48" y1="-14" x2="-48" y2="14"/>
        <line x1="-18" y1="-16" x2="-18" y2="16"/>
        <line x1="12" y1="-14" x2="12" y2="14"/>
        <line x1="42" y1="-16" x2="42" y2="16"/>
        <line x1="72" y1="-14" x2="72" y2="14"/>
        <line x1="102" y1="-16" x2="102" y2="16"/>
      </g>
      <g fill="#fffaf0" opacity=".95">
        <circle cx="-118" cy="-6" r="5"/><circle cx="-88" cy="8" r="6"/>
        <circle cx="-58" cy="-7" r="5"/><circle cx="-28" cy="8" r="6"/>
        <circle cx="2" cy="-6" r="5"/><circle cx="32" cy="8" r="6"/>
        <circle cx="62" cy="-7" r="5"/><circle cx="92" cy="6" r="6"/>
        <circle cx="118" cy="-4" r="4"/>
      </g>
    </g>
  </defs>

  <circle cx="256" cy="256" r="250" fill="#462611"/>
  <circle cx="256" cy="256" r="230" fill="url(#fg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#e84a7a" stroke-width="12"
          stroke-dasharray="16 13" stroke-linecap="round"/>

  <!-- Churros cruzados -->
  <use href="#stick" transform="rotate(-42 256 240) translate(256 240) scale(.72)"/>
  <use href="#stick" transform="rotate(42 256 240) translate(256 240) scale(.72)"/>

  <!-- Taza de chocolate -->
  <g transform="translate(330 352) scale(.42)">
    <use href="#stick" transform="translate(-6 -112) rotate(58) scale(.62)"/>
    <path d="M-96 -4 h192 l-16 128 a34 34 0 0 1 -34 30 h-92 a34 34 0 0 1 -34 -30 z"
          fill="#fffaf0" stroke="#462611" stroke-width="10"/>
    <ellipse cx="0" cy="-4" rx="96" ry="27" fill="#5c3118" stroke="#462611" stroke-width="10"/>
    <ellipse cx="0" cy="-6" rx="74" ry="17" fill="#8a4a22"/>
    <path d="M96 28 q40 6 34 34 q-6 22 -34 24" fill="none" stroke="#462611" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Corazón -->
  <path d="M196 356 c0 -18 26 -28 38 -10 c12 -18 38 -8 38 10 c0 20 -38 44 -38 44 s-38 -24 -38 -44 z"
        fill="#e84a7a"/>
</svg>
